<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareLink Connect AI 血糖監測儀表板</title>
    <!-- 引入 premium Google 字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #090d16 50%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-glow-green: rgba(16, 185, 129, 0.15);
            --glass-glow-orange: rgba(249, 115, 22, 0.15);
            --glass-glow-red: rgba(239, 68, 68, 0.15);
            
            --color-green: #10b981;
            --color-orange: #f97316;
            --color-red: #ef4444;
            --color-blue: #3b82f6;
            --color-text-primary: #f8fafc;
            --color-text-secondary: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--color-text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 背景流光裝飾 */
        .ambient-glow {
            position: absolute;
            width: 40vw;
            height: 40vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0) 70%);
            top: -10vw;
            right: -10vw;
            z-index: -1;
            pointer-events: none;
            filter: blur(50px);
        }
        
        .ambient-glow-2 {
            position: absolute;
            width: 50vw;
            height: 50vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, rgba(16, 185, 129, 0) 70%);
            bottom: -15vw;
            left: -15vw;
            z-index: -1;
            pointer-events: none;
            filter: blur(60px);
        }

        header {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 1.5rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-group {
            display: flex;
            flex-direction: column;
        }

        .logo-group h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-group p {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            margin-top: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* 脈動連線指示燈 */
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--color-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--color-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        .status-dot.loading {
            background-color: var(--color-orange);
            box-shadow: 0 0 10px var(--color-orange);
            animation: pulse-orange 1.5s infinite;
        }

        @keyframes pulse-orange {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(249, 115, 22, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
        }

        /* 手動更新按鈕 */
        .btn-refresh {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--color-text-primary);
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .btn-refresh:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-refresh:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-refresh:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 儀表板版面配置 */
        main {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem 3rem 1.5rem;
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1.5rem;
        }

        /* 玻璃擬態卡片基本樣式 */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.75rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        .glass-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.3);
        }

        /* 各別卡片位置設定 */
        .card-glucose {
            grid-column: span 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .card-iob {
            grid-column: span 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-ai {
            grid-column: span 5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.05) 0%, rgba(165, 180, 252, 0.02) 100%);
            border: 1px solid rgba(99, 102, 241, 0.2);
            box-shadow: 0 8px 32px 0 rgba(99, 102, 241, 0.08);
        }
        
        .card-ai:hover {
            border-color: rgba(99, 102, 241, 0.35);
            box-shadow: 0 12px 40px 0 rgba(99, 102, 241, 0.15);
        }

        .card-chart {
            grid-column: span 12;
            min-height: 380px;
        }

        /* 血糖顯示核心視覺 */
        .glucose-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 1.5rem 0;
            transition: all 0.5s ease;
        }

        .glucose-circle.normal {
            border-color: var(--color-green);
            box-shadow: 0 0 25px var(--glass-glow-green);
            background: radial-gradient(circle, var(--glass-glow-green) 0%, transparent 70%);
        }

        .glucose-circle.high {
            border-color: var(--color-orange);
            box-shadow: 0 0 25px var(--glass-glow-orange);
            background: radial-gradient(circle, var(--glass-glow-orange) 0%, transparent 70%);
        }

        .glucose-circle.hyper {
            border-color: var(--color-red);
            box-shadow: 0 0 25px var(--glass-glow-red);
            background: radial-gradient(circle, var(--glass-glow-red) 0%, transparent 70%);
        }

        .glucose-value {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -1px;
            color: #fff;
        }

        .glucose-unit {
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.25rem;
        }

        .glucose-trend {
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-text-primary);
            padding: 0.35rem 0.85rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        /* IOB 顯示 */
        .card-title {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title svg {
            width: 16px;
            height: 16px;
            fill: var(--color-blue);
        }

        .iob-value-container {
            margin: 2rem 0;
        }

        .iob-value {
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
        }

        .iob-unit {
            font-size: 1.2rem;
            color: var(--color-text-secondary);
            font-weight: 400;
            margin-left: 0.25rem;
        }

        .card-footer-text {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            line-height: 1.4;
        }

        /* AI 叮嚀卡片 */
        .ai-title-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .ai-badge {
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
            letter-spacing: 0.5px;
        }

        .ai-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #e2e8f0;
            margin: 1.5rem 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            position: relative;
        }
        
        .ai-content::before {
            content: '"';
            font-family: 'Outfit', sans-serif;
            font-size: 4rem;
            color: rgba(99, 102, 241, 0.15);
            position: absolute;
            top: -2.5rem;
            left: -0.75rem;
            font-style: italic;
        }

        /* 圖表區域 */
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .chart-container {
            width: 100%;
            height: calc(100% - 40px);
            position: relative;
        }

        /* 錯誤警示條 */
        .error-banner {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto 1.5rem auto;
            padding: 0 1.5rem;
            display: none;
        }

        .error-card {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 16px;
            padding: 1rem 1.5rem;
            color: #fca5a5;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .error-card button {
            background: transparent;
            border: none;
            color: #fca5a5;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* 響應式佈局調整 */
        @media (max-width: 1024px) {
            main {
                grid-template-columns: repeat(6, 1fr);
            }
            .card-glucose {
                grid-column: span 3;
            }
            .card-iob {
                grid-column: span 3;
            }
            .card-ai {
                grid-column: span 6;
            }
            .card-chart {
                grid-column: span 6;
            }
        }

        @media (max-width: 640px) {
            main {
                grid-template-columns: 1fr;
                padding: 0 1rem 2rem 1rem;
            }
            header {
                flex-direction: column;
                gap: 1.5rem;
                align-items: flex-start;
                padding: 1.5rem 1rem 1rem 1rem;
            }
            .btn-refresh {
                width: 100%;
                justify-content: center;
            }
            .card-glucose, .card-iob, .card-ai, .card-chart {
                grid-column: 1 / -1;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>

    <header>
        <div class="logo-group">
            <h1>CareLink Connect AI</h1>
            <p>
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">系統正常連線中</span>
                <span id="update-time" style="margin-left: 0.5rem; opacity: 0.7;">更新時間: --:--:--</span>
            </p>
        </div>
        <button class="btn-refresh" id="btn-refresh" onclick="triggerRefresh()">
            <span class="spinner" id="spinner"></span>
            <svg id="refresh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            手動重新整理
        </button>
    </header>

    <div class="error-banner" id="error-banner">
        <div class="error-card">
            <span id="error-text">錯誤：無法取得 CareLink 連線資料</span>
            <button onclick="dismissError()">×</button>
        </div>
    </div>

    <main>
        <!-- 血糖圓環 Card -->
        <div class="glass-card card-glucose">
            <div class="card-title">
                <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" fill="#10b981"/></svg>
                即時血糖監測
            </div>
            <div class="glucose-circle normal" id="glucose-circle">
                <span class="glucose-value" id="glucose-value">--</span>
                <span class="glucose-unit">mg/dL</span>
            </div>
            <div class="glucose-trend" id="glucose-trend">
                <span id="trend-icon">➡️</span>
                <span id="trend-text">讀取中</span>
            </div>
        </div>

        <!-- 胰島素 IOB Card -->
        <div class="glass-card card-iob">
            <div class="card-title">
                <!-- 胰島素液滴圖標 -->
                <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" /></svg>
                活性胰島素 (IOB)
            </div>
            <div class="iob-value-container">
                <span class="iob-value" id="iob-value">0.00</span>
                <span class="iob-unit">U</span>
            </div>
            <div class="card-footer-text">
                泵內仍在發揮降血糖效能的活性胰島素量，可用於輔助評估安全進食與追加劑量。
            </div>
        </div>

        <!-- AI 醫學叮嚀 Card -->
        <div class="glass-card card-ai">
            <div class="ai-title-group">
                <div class="card-title" style="color: #a5b4fc;">
                    <!-- AI 晶片圖標 -->
                    <svg viewBox="0 0 24 24" style="fill: #818cf8;"><path d="M19 19H5V5h14v14zM9 17h6v-2H9v2zm0-4h6v-2H9v2zm0-4h6V7H9v2z" /></svg>
                    Groq AI 照護建議
                </div>
                <span class="ai-badge">Llama 3 Active</span>
            </div>
            <div class="ai-content" id="ai-advice">
                讀取中，正在載入 Groq 醫學模型分析數據...
            </div>
            <div class="card-footer-text" style="opacity: 0.6; font-size: 0.75rem;">
                💡 本建議由 Groq AI 生成，僅供參考，調整胰島素設定前請務必諮詢專業醫療人員。
            </div>
        </div>

        <!-- 歷史圖表 Card -->
        <div class="glass-card card-chart">
            <div class="chart-header">
                <div class="card-title">
                    <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z" fill="#3b82f6"/></svg>
                    血糖趨勢圖 (近 12 小時)
                </div>
            </div>
            <div class="chart-container">
                <canvas id="cgmChart"></canvas>
            </div>
        </div>
    </main>

    <script>
        let cgmChartInstance = null;
        let lastTimestamp = "";

        // 初始化圖表
        function initChart(historyData) {
            const ctx = document.getElementById('cgmChart').getContext('2d');
            
            // 建立背景漸變
            const chartGlow = ctx.createLinearGradient(0, 0, 0, 300);
            chartGlow.addColorStop(0, 'rgba(99, 102, 241, 0.25)');
            chartGlow.addColorStop(1, 'rgba(99, 102, 241, 0.0)');

            const labels = historyData.map(d => {
                // 將 ISO 格式的日期字串整理成 HH:MM 格式方便看
                try {
                    const dt = new Date(d.time);
                    return dt.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
                } catch(e) {
                    return d.time;
                }
            });
            const values = historyData.map(d => d.glucose);

            const config = {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '血糖 (mg/dL)',
                        data: values,
                        borderColor: '#818cf8',
                        borderWidth: 3,
                        pointBackgroundColor: '#818cf8',
                        pointBorderColor: 'rgba(255, 255, 255, 0.8)',
                        pointBorderWidth: 1.5,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        tension: 0.35,
                        fill: true,
                        backgroundColor: chartGlow
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleFont: { size: 13, family: 'Outfit' },
                            bodyFont: { size: 13, family: 'Outfit' },
                            padding: 12,
                            cornerRadius: 12,
                            borderColor: 'rgba(255,255,255,0.1)',
                            borderWidth: 1,
                            displayColors: false
                        }
                    },
                    scales: {
                        y: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)',
                                drawTicks: false
                            },
                            ticks: {
                                color: '#94a3b8',
                                font: { family: 'Outfit', size: 11 }
                            },
                            min: 40,
                            max: 300
                        },
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                color: '#94a3b8',
                                font: { family: 'Outfit', size: 10 },
                                maxRotation: 0,
                                autoSkip: true,
                                maxTicksLimit: 12
                            }
                        }
                    }
                }
            };

            cgmChartInstance = new Chart(ctx, config);
        }

        // 更新圖表數據
        function updateChart(historyData) {
            if (!cgmChartInstance) {
                initChart(historyData);
                return;
            }
            const labels = historyData.map(d => {
                try {
                    const dt = new Date(d.time);
                    return dt.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
                } catch(e) {
                    return d.time;
                }
            });
            const values = historyData.map(d => d.glucose);
            
            cgmChartInstance.data.labels = labels;
            cgmChartInstance.data.datasets[0].data = values;
            
            // 根據最新血糖變更線條顏色
            if (values.length > 0) {
                const latestVal = values[values.length - 1];
                let color = '#818cf8'; // 預設藍紫
                if (latestVal < 70) color = '#ef4444'; // 低血糖紅
                else if (latestVal > 180) color = '#f97316'; // 高血糖橘
                
                cgmChartInstance.data.datasets[0].borderColor = color;
                cgmChartInstance.data.datasets[0].pointBackgroundColor = color;
            }
            
            cgmChartInstance.update();
        }

        // 拉取後端最新數據
        function fetchCGMData() {
            fetch('/api/cgm')
                .then(res => res.json())
                .then(data => {
                    // 更新載入與錯誤狀態
                    const statusDot = document.getElementById('status-dot');
                    const statusText = document.getElementById('status-text');
                    const btnRefresh = document.getElementById('btn-refresh');
                    const refreshIcon = document.getElementById('refresh-icon');
                    const spinner = document.getElementById('spinner');

                    if (data.is_loading) {
                        statusDot.className = 'status-dot loading';
                        statusText.innerText = '正在從 CareLink 更新數據...';
                        btnRefresh.disabled = true;
                        refreshIcon.style.display = 'none';
                        spinner.style.display = 'inline-block';
                    } else {
                        statusDot.className = 'status-dot';
                        statusText.innerText = '系統監控中';
                        btnRefresh.disabled = false;
                        refreshIcon.style.display = 'inline-block';
                        spinner.style.display = 'none';
                    }

                    if (data.error) {
                        showError(data.error);
                    } else {
                        dismissError();
                    }

                    // 填入最新血糖數值
                    if (data.glucose) {
                        document.getElementById('glucose-value').innerText = data.glucose;
                        
                        // 根據血糖值狀態更新圓環樣式
                        const circle = document.getElementById('glucose-circle');
                        circle.className = 'glucose-circle';
                        if (data.glucose < 70) {
                            circle.classList.add('hyper'); // 低血糖用紅色外圈
                        } else if (data.glucose > 180) {
                            circle.classList.add('high'); // 高血糖橘色
                        } else {
                            circle.classList.add('normal'); // 正常綠色
                        }
                    }

                    // 趨勢
                    if (data.trend) {
                        document.getElementById('trend-text').innerText = data.trend;
                        // 取得箭頭圖標
                        const arrow = data.trend.split(' ')[0] || '➡️';
                        document.getElementById('trend-icon').innerText = arrow;
                    }

                    // IOB
                    if (data.iob !== null && data.iob !== undefined) {
                        document.getElementById('iob-value').innerText = Number(data.iob).toFixed(2);
                    }

                    // AI 叮嚀
                    if (data.ai_advice) {
                        const aiAdviceEl = document.getElementById('ai-advice');
                        // 只有在新叮嚀時才進行微動畫更新
                        if (aiAdviceEl.innerHTML !== data.ai_advice) {
                            aiAdviceEl.style.opacity = 0;
                            setTimeout(() => {
                                aiAdviceEl.innerText = data.ai_advice;
                                aiAdviceEl.style.transition = 'opacity 0.5s ease-on-out';
                                aiAdviceEl.style.opacity = 1;
                            }, 300);
                        }
                    }

                    // 更新時間
                    if (data.time) {
                        try {
                            const dt = new Date(data.time);
                            const formattedTime = dt.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
                            document.getElementById('update-time').innerText = `資料時間: ${formattedTime}`;
                        } catch (e) {
                            document.getElementById('update-time').innerText = `資料時間: ${data.time}`;
                        }
                    }

                    // 更新歷史圖表
                    if (data.history && data.history.length > 0) {
                        updateChart(data.history);
                    }
                })
                .catch(err => {
                    console.error('拉取資料失敗:', err);
                    showError('連線後端 API 伺服器異常');
                });
        }

        // 觸發手動重整
        function triggerRefresh() {
            const btnRefresh = document.getElementById('btn-refresh');
            const refreshIcon = document.getElementById('refresh-icon');
            const spinner = document.getElementById('spinner');

            btnRefresh.disabled = true;
            refreshIcon.style.display = 'none';
            spinner.style.display = 'inline-block';

            fetch('/api/force_refresh', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        // 2 秒後開始輪詢查看結果
                        setTimeout(fetchCGMData, 2000);
                    } else {
                        showError(data.message || '觸發重整失敗');
                        btnRefresh.disabled = false;
                        refreshIcon.style.display = 'inline-block';
                        spinner.style.display = 'none';
                    }
                })
                .catch(err => {
                    showError('發送重整請求失敗');
                    btnRefresh.disabled = false;
                    refreshIcon.style.display = 'inline-block';
                    spinner.style.display = 'none';
                });
        }

        function showError(msg) {
            document.getElementById('error-text').innerText = msg;
            document.getElementById('error-banner').style.display = 'block';
        }

        function dismissError() {
            document.getElementById('error-banner').style.display = 'none';
        }

        // 頁面加載後啟動自動輪詢
        window.addEventListener('DOMContentLoaded', () => {
            fetchCGMData();
            // 每 10 秒向背景 Flask 同步一次狀態
            setInterval(fetchCGMData, 10000);
        });
    </script>
</body>
</html>
