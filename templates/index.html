<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SophiaCarelink - 美敦力 Continuous Glucose Monitor</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161c2e;
            --card-border: #232b45;
            --accent-green: #00e676;
            --accent-orange: #ff9100;
            --accent-red: #ff5252;
            --accent-blue: #00b0ff;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #00b0ff, #00e676);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #000;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand-sub {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        /* Dashboard Grid */
        .grid-main {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-main {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        /* Glucose Gauge Card */
        .glucose-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 280px;
        }

        .glucose-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            margin-bottom: 12px;
        }

        .glucose-number {
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 8px;
            color: var(--accent-green);
        }

        .glucose-unit {
            font-size: 1.1rem;
            color: var(--text-sub);
            margin-left: 4px;
        }

        .glucose-trend {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            font-weight: 600;
            font-size: 1rem;
            margin-top: 10px;
        }

        .time-badge {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 14px;
        }

        /* Chart Card */
        .chart-card {
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .chart-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 220px;
        }

        /* Stats Row */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .stat-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }

        .stat-val {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-top: 4px;
        }

        .stat-lbl {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(22, 28, 46, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand">
                <div class="brand-icon">🩸</div>
                <div>
                    <div class="brand-title">SophiaCarelink</div>
                    <div class="brand-sub">Medtronic CareLink Continuous Glucose Monitor</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn" onclick="triggerSync()">🔄 手動同步</button>
            </div>
        </header>

        <!-- Main Dashboard -->
        <div class="grid-main">
            <!-- Glucose Gauge -->
            <div class="card glucose-card">
                <div class="glucose-label">最新連續血糖</div>
                <div>
                    <span class="glucose-number" id="glucose-val">--</span>
                    <span class="glucose-unit">mg/dL</span>
                </div>
                <div class="glucose-trend" id="glucose-trend">
                    <span id="trend-icon">--</span>
                    <span id="trend-text">載入中...</span>
                </div>
                <div class="time-badge" id="last-update">最後更新: 讀取中</div>
            </div>

            <!-- Realtime Chart -->
            <div class="card chart-card">
                <div class="card-header">
                    <div class="card-title">📈 血糖趨勢圖 (最近 24 小時)</div>
                </div>
                <div class="chart-container">
                    <canvas id="cgmChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-lbl">24h 平均血糖</div>
                <div class="stat-val" id="stat-avg">-- mg/dL</div>
            </div>
            <div class="stat-box">
                <div class="stat-lbl">TIR (目標範圍內 %)</div>
                <div class="stat-val" style="color: var(--accent-green);" id="stat-tir">-- %</div>
            </div>
            <div class="stat-box">
                <div class="stat-lbl">預估 HbA1c (GMI)</div>
                <div class="stat-val" style="color: var(--accent-orange);" id="stat-gmi">-- %</div>
            </div>
            <div class="stat-box">
                <div class="stat-lbl">最高 / 最低</div>
                <div class="stat-val" style="font-size: 1.1rem; margin-top: 8px;" id="stat-range">-- / --</div>
            </div>
        </div>

        <!-- Status Footer -->
        <div class="status-bar">
            <div>
                <span class="dot"></span> CareLink 連線狀態: <strong id="status-text" style="color:#fff;">連線成功</strong>
                <span style="margin-left: 12px; padding: 3px 10px; background: rgba(34, 197, 94, 0.15); border: 1px solid var(--accent-green); border-radius: 20px; font-size: 0.75rem; color: var(--accent-green); font-weight: 500;">🟢 Token 自動續約生效中</span>
            </div>
            <div>帳號: <strong>Sophiafa</strong> | 設備: Medtronic MiniMed</div>
        </div>
    </div>

    <script>
        let chartInstance = null;

        async function fetchDashboard() {
            try {
                const res = await fetch('/api/v1/entries');
                const data = await res.json();
                
                if (data.latest) {
                    const val = data.latest.sgv;
                    const valElem = document.getElementById('glucose-val');
                    valElem.innerText = val;

                    // 顏色變化
                    if (val > 180) valElem.style.color = 'var(--accent-orange)';
                    else if (val < 70) valElem.style.color = 'var(--accent-red)';
                    else valElem.style.color = 'var(--accent-green)';

                    document.getElementById('trend-icon').innerText = getDirectionIcon(data.latest.direction);
                    document.getElementById('trend-text').innerText = data.latest.direction;
                    
                    const updateDate = new Date(data.latest.dateString);
                    const formattedTime = updateDate.toLocaleString('zh-TW', { hour12: false });
                    document.getElementById('last-update').innerText = `最後更新: ${formattedTime}`;
                }

                if (data.stats) {
                    document.getElementById('stat-avg').innerText = `${data.stats.avg} mg/dL`;
                    document.getElementById('stat-tir').innerText = `${data.stats.tir}%`;
                    document.getElementById('stat-gmi').innerText = `${data.stats.gmi}%`;
                    document.getElementById('stat-range').innerText = `${data.stats.max} / ${data.stats.min}`;
                }

                if (data.history && data.history.length > 0) {
                    renderChart(data.history);
                }
            } catch (err) {
                console.error("Dashboard error:", err);
            }
        }

        function getDirectionIcon(dir) {
            const map = {
                "DoubleUp": "⇈", "SingleUp": "↑", "FortyFiveUp": "↗",
                "Flat": "→", "FortyFiveDown": "↘", "SingleDown": "↓", "DoubleDown": "⇊"
            };
            return map[dir] || "→";
        }

        function renderChart(history) {
            const ctx = document.getElementById('cgmChart').getContext('2d');
            const labels = history.map(h => {
                const d = new Date(h.dateString);
                return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            });
            const values = history.map(h => h.sgv);

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '血糖 (mg/dL)',
                        data: values,
                        borderColor: '#00e676',
                        backgroundColor: 'rgba(0, 230, 118, 0.08)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 2,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#232b45' }, ticks: { color: '#94a3b8' } },
                        y: { min: 40, max: 300, grid: { color: '#232b45' }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }

        async function triggerSync() {
            try {
                const res = await fetch('/api/v1/sync', { method: 'POST' });
                const json = await res.json();
                alert(json.status === 'success' ? '同步成功！' : '同步完成（若無 token 請點擊登入授權）。');
                fetchDashboard();
            } catch (e) {
                alert('同步發生錯誤');
            }
        }

        fetchDashboard();
        setInterval(fetchDashboard, 30000); // 30 秒自動刷洗介面
    </script>
</body>
</html>
